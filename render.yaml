services:
  - type: web
    name: github-mcp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: MCP_SECRET
        sync: false
      - key: FULL_CONTROL
        value: "true"
